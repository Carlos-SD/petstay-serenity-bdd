serenity {
  project.name = "PetStay"
  test.root = "features"
  requirements.dir = "features"
  requirements.base.dir = "src/test/resources"
  outputDirectory = "target/site/serenity"
  report.encoding = "UTF8"
  take.screenshots = FOR_EACH_ACTION
  # Every scenario starts with a clean browser (empty localStorage, no session)
  restart.browser.for.each = scenario

  # Traceability: the @issue:#N tag of each scenario links to issue N of the repository.
  # Replace <user>/<repository> with your GitHub repo and uncomment the line.
  # issue.tracker.url = "https://github.com/<user>/<repository>/issues/{0}"
}

webdriver {
  base.url = "https://petstay-aphn.onrender.com/"
  timeouts.implicitlywait = 15000
}

# Runs without a window (required on GitHub Actions). To watch the browser locally:
#   ./gradlew clean test -Dheadless.mode=false
headless.mode = true

# Default browser: chrome. For another browser: ./gradlew clean test -Denvironment=edge
environments {
  default {
    webdriver {
      driver = "chrome"
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["--window-size=1920,1080", "--enable-automation", "--no-sandbox", "--disable-dev-shm-usage",
            "--disable-popup-blocking", "--disable-infobars", "--disable-notifications",
            "--remote-allow-origins=*", "--ignore-certificate-errors"]
        }
      }
    }
  }
  chrome = ${environments.default}
  edge {
    webdriver {
      driver = "edge"
      autodownload = true
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["test-type", "ignore-certificate-errors", "incognito", "disable-infobars",
            "disable-gpu", "disable-default-apps", "disable-popup-blocking", "window-size=1920,1080"]
        }
      }
    }
  }
  firefox {
    webdriver {
      driver = "firefox"
      autodownload = true
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true
      }
    }
  }
}
